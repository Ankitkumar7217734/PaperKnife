name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Offline OCR Assets
        run: |
          mkdir -p public/tesseract
          cp node_modules/tesseract.js/dist/worker.min.js public/tesseract/worker.min.js
          cp node_modules/tesseract.js-core/tesseract-core.wasm.js public/tesseract/tesseract-core.wasm.js
          cp node_modules/tesseract.js-core/tesseract-core.wasm public/tesseract/tesseract-core.wasm
          curl --fail --location --retry 3 -o public/tesseract/eng.traineddata.gz https://raw.githubusercontent.com/naptha/tessdata/gh-pages/4.0.0/eng.traineddata.gz
          gunzip -f public/tesseract/eng.traineddata.gz

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /PaperKnife/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
